<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人喜好分析</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --raised: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.1);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
    --up: #006300; --down: #b3261e;
    --accent: #c73a27;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme='light'])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.1);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --seq-0: #262625; --seq-1: #0d366b; --seq-2: #104281; --seq-3: #184f95; --seq-4: #1c5cab; --seq-5: #2a78d6; --seq-6: #5598e7; --seq-7: #9ec5f4;
      --up: #0ca30c; --down: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.7 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 20px 96px; }
  h1 { font-size: 34px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font-size: 22px; margin: 64px 0 6px; }
  h2 .no { color: var(--accent); font-size: 15px; margin-right: 10px; font-weight: 600; }
  h3 { font-size: 15px; margin: 24px 0 8px; color: var(--ink-2); font-weight: 600; }
  p { margin: 8px 0; color: var(--ink-2); }
  .lead { font-size: 17px; color: var(--ink); max-width: 760px; }
  .meta { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 20px; margin-top: 16px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .tile .l { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { border: 1px solid var(--ring); background: var(--raised); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; }
  .chip b { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .hero { background: var(--surface); border: 1px solid var(--ring); border-radius: 18px; padding: 28px; margin-top: 28px; }
  .hero .who { font-size: 20px; font-weight: 600; line-height: 1.6; color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--axis); padding-left: 10px; margin-top: 12px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  th { color: var(--muted); font-weight: 500; }
  td.n { text-align: right; }
  svg text { fill: var(--muted); font-size: 11.5px; font-family: inherit; }
  svg .lab { fill: var(--ink-2); font-size: 12.5px; }
  svg .val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .era { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--grid); }
  .era:first-child { border-top: 0; }
  .era .when { font-weight: 600; }
  .era .when span { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .era .what { color: var(--ink-2); }
  .era .what b { color: var(--ink); }
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 16px; }
  .char { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; overflow: hidden; }
  .char .img { aspect-ratio: 3 / 4; background: var(--seq-0) center / cover no-repeat; }
  .char .body { padding: 10px 12px 12px; }
  .char .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .char .wk { font-size: 12px; color: var(--muted); }
  .char .ct { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .tip { position: fixed; pointer-events: none; background: var(--raised); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); opacity: 0; transition: opacity 0.1s; z-index: 9; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  ul.points { padding-left: 18px; margin: 8px 0; color: var(--ink-2); }
  ul.points li { margin: 6px 0; }
  ul.points b { color: var(--ink); }
  .finds { display: grid; gap: 12px; margin-top: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .find { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 16px; }
  .find .fn { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
  .find .fh { font-weight: 600; font-size: 15.5px; margin-bottom: 4px; }
  .find .fb { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; }
  .find .fb b { color: var(--ink); }
  .g2w { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
  @media (max-width: 640px) { .finds, .g2w { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .era { grid-template-columns: 1fr; gap: 4px; } h1 { font-size: 28px; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="tip" id="tip"></div>
<script>
const D = /*DATA*/ null;
const S = /*STORY*/ null;
</script>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = (n) => Math.round(n).toLocaleString('zh-CN');
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const tip = document.getElementById('tip');
const showTip = (e, html) => { tip.innerHTML = html; tip.style.opacity = 1; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = e.clientY + 14 + 'px'; };
const hideTip = () => (tip.style.opacity = 0);
document.addEventListener('mousemove', (e) => { const t = e.target.closest('[data-tip]'); t ? showTip(e, t.dataset.tip) : hideTip(); });
const SER = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'].map((v) => `var(${v})`);

/** 横向条形：[{label, value, sub?, tip?}]，value 已是比例或数量；fmtv 格式化 */
function hbars(rows, { width = 460, fmtv = (v) => pct(v), max, color = 'var(--s1)', labelW = 118 } = {}) {
  const rowH = 26, barH = 14, w = width - labelW - 64;
  const m = max ?? Math.max(...rows.map((r) => r.value), 1e-9);
  const h = rows.length * rowH + 4;
  let g = '';
  rows.forEach((r, i) => {
    const y = i * rowH + 4, bw = Math.max(2, (r.value / m) * w);
    g += `<g data-tip="${esc(r.tip ?? `${r.label}：${fmtv(r.value)}`)}">
      <rect x="0" y="${y - 2}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + barH - 2}" text-anchor="end">${esc(r.label)}</text>
      <path d="M${labelW},${y} h${bw - 4} a4,4 0 0 1 4,4 v${barH - 8} a4,4 0 0 1 -4,4 h${-(bw - 4)} z" fill="${r.color ?? color}"/>
      <text class="val" x="${labelW + bw + 6}" y="${y + barH - 2}">${esc(fmtv(r.value))}</text></g>`;
  });
  return `<svg viewBox="0 0 ${width} ${h}" width="100%" role="img">${g}</svg>`;
}

/** 按月的柱子 */
function columns(entries, { width = 1000, height = 200, color = 'var(--s1)' } = {}) {
  const pad = { l: 40, r: 8, t: 10, b: 26 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const max = Math.max(...entries.map((e) => e[1]));
  const top = Math.ceil(max / 500) * 500;
  const step = w / entries.length, bw = Math.min(14, step - 2);
  let g = '';
  for (let v = 0; v <= top; v += 500) { const y = pad.t + h - (v / top) * h; g += `<line x1="${pad.l}" x2="${width - pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
  entries.forEach(([k, v], i) => {
    const x = pad.l + i * step + (step - bw) / 2, bh = (v / top) * h, y = pad.t + h - bh;
    g += `<g data-tip="${k}：${fmt(v)} 张"><rect x="${pad.l + i * step}" y="${pad.t}" width="${step}" height="${h}" fill="transparent"/><path d="M${x},${y + bh} v${-(bh - 3)} a3,3 0 0 1 3,-3 h${bw - 6} a3,3 0 0 1 3,3 v${bh - 3} z" fill="${color}"/></g>`;
    if (k.endsWith('-01')) g += `<text x="${x + bw / 2}" y="${height - 6}" text-anchor="middle">${k.slice(0, 4)}</text>`;
  });
  g += `<line x1="${pad.l}" x2="${width - pad.r}" y1="${pad.t + h}" y2="${pad.t + h}" stroke="var(--axis)"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img">${g}</svg>`;
}

/** 一天 24 小时 */
function hours(arr, { width = 480, height = 170 } = {}) {
  const pad = { l: 8, r: 8, t: 10, b: 24 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const tot = arr.reduce((a, b) => a + b, 0), max = Math.max(...arr);
  const step = w / 24, bw = Math.min(14, step - 3);
  let g = '';
  arr.forEach((v, i) => {
    const x = pad.l + i * step + (step - bw) / 2, bh = (v / max) * h, y = pad.t + h - bh;
    const night = i <= 4 || i >= 23;
    g += `<g data-tip="${i}:00–${i + 1}:00：${pct(v / tot)}"><rect x="${pad.l + i * step}" y="${pad.t}" width="${step}" height="${h}" fill="transparent"/><path d="M${x},${y + bh} v${-(bh - 3)} a3,3 0 0 1 3,-3 h${bw - 6} a3,3 0 0 1 3,3 v${bh - 3} z" fill="${night ? 'var(--s7)' : 'var(--s1)'}"/></g>`;
    if (i % 3 === 0) g += `<text x="${x + bw / 2}" y="${height - 6}" text-anchor="middle">${i}时</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img">${g}</svg>`;
}

/** 行 × 时期 的热力格：rows=[{label, values[]}]，values 是比例 */
function heat(rows, periods, { width = 1000, labelW = 130, fmtv = (v) => pct(v, 0) } = {}) {
  const cellH = 26, cw = (width - labelW) / periods.length;
  const max = Math.max(...rows.flatMap((r) => r.values));
  const step = (v) => { if (v <= 0) return 'var(--seq-0)'; const k = Math.min(7, 1 + Math.floor((v / max) * 6.999)); return `var(--seq-${k})`; };
  let g = '';
  periods.forEach((p, j) => (g += `<text x="${labelW + j * cw + cw / 2}" y="14" text-anchor="middle">${esc(p)}</text>`));
  rows.forEach((r, i) => {
    const y = 22 + i * cellH;
    g += `<text class="lab" x="${labelW - 8}" y="${y + 17}" text-anchor="end">${esc(r.label)}</text>`;
    r.values.forEach((v, j) => {
      const dark = v / max > 0.55;
      g += `<g data-tip="${esc(r.label)} · ${esc(periods[j])}：${fmtv(v)}"><rect x="${labelW + j * cw + 1}" y="${y + 1}" width="${cw - 2}" height="${cellH - 2}" rx="4" fill="${step(v)}"/>${v >= max * 0.2 ? `<text x="${labelW + j * cw + cw / 2}" y="${y + 17}" text-anchor="middle" style="fill:${dark ? '#fff' : 'var(--ink-2)'};font-size:11px">${fmtv(v)}</text>` : ''}</g>`;
    });
  });
  return `<svg viewBox="0 0 ${width} ${22 + rows.length * cellH + 4}" width="100%" role="img">${g}</svg>`;
}

/** 百分比堆叠横条：每个时期一条，segs=[{key,label,color}] */
function stack100(periods, data, segs, { width = 1000, labelW = 80 } = {}) {
  const rowH = 26, barH = 16, w = width - labelW - 10;
  let g = '';
  periods.forEach((p, i) => {
    const d = data[p]; if (!d) return;
    const tot = segs.reduce((a, s) => a + (d[s.key] ?? 0), 0);
    const y = i * rowH + 4;
    let x = labelW;
    g += `<text class="lab" x="${labelW - 8}" y="${y + barH - 3}" text-anchor="end">${esc(p)}</text>`;
    segs.forEach((s) => {
      const v = (d[s.key] ?? 0) / tot, sw = v * w;
      if (sw <= 0) return;
      g += `<g data-tip="${esc(p)} · ${esc(s.label)}：${pct(v)}"><rect x="${x}" y="${y}" width="${Math.max(0, sw - 2)}" height="${barH}" rx="3" fill="${s.color}"/>${sw > 44 ? `<text x="${x + 6}" y="${y + barH - 4}" style="fill:#fff;font-size:11px">${pct(v, 0)}</text>` : ''}</g>`;
      x += sw;
    });
  });
  return `<svg viewBox="0 0 ${width} ${periods.length * rowH + 8}" width="100%" role="img">${g}</svg>`;
}

/** 两个时点的对比（早期 → 近期）：[{label, a, b}] */
function slope(rows, { width = 460, labelW = 118, aLabel = '早期', bLabel = '近期' } = {}) {
  const rowH = 26, w = width - labelW - 70;
  const max = Math.max(...rows.flatMap((r) => [r.a, r.b]));
  let g = `<text x="${labelW}" y="12">0</text><text x="${labelW + w}" y="12" text-anchor="end">${pct(max, 0)}</text>`;
  rows.forEach((r, i) => {
    const y = 26 + i * rowH, xa = labelW + (r.a / max) * w, xb = labelW + (r.b / max) * w;
    const up = r.b > r.a;
    g += `<g data-tip="${esc(r.label)}：${bLabel === '近期' ? '早期' : aLabel} ${pct(r.a)} → ${bLabel} ${pct(r.b)}">
      <rect x="0" y="${y - 12}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text>
      <line x1="${labelW}" x2="${labelW + w}" y1="${y}" y2="${y}" stroke="var(--grid)"/>
      <line x1="${xa}" x2="${xb}" y1="${y}" y2="${y}" stroke="${up ? 'var(--up)' : 'var(--down)'}" stroke-width="2"/>
      <circle cx="${xa}" cy="${y}" r="4" fill="var(--axis)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${xb}" cy="${y}" r="5" fill="${up ? 'var(--up)' : 'var(--down)'}" stroke="var(--surface)" stroke-width="2"/>
      <text class="val" x="${Math.max(xa, xb) + 10}" y="${y + 4}">${pct(r.b)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${width} ${26 + rows.length * rowH}" width="100%" role="img">${g}</svg>`;
}

/** 小折线：一行里放在角色卡上 */
function spark(values, { width = 126, height = 28 } = {}) {
  const max = Math.max(...values, 1), n = values.length;
  const pts = values.map((v, i) => `${(i / (n - 1)) * (width - 6) + 3},${height - 3 - (v / max) * (height - 6)}`).join(' ');
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}"><polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// ---------------------------------------------------------------- 新图表
/** 偏爱指数的双向条（对数刻度，×1 为中线） */
function divbars(rows, { width = 460, labelW = 118 } = {}) {
  const rowH = 24, barH = 12, lo = Math.log2(0.18), hi = Math.log2(8.5), w = width - labelW - 52;
  const x0 = labelW + (w * -lo) / (hi - lo);
  const X = (v) => labelW + (w * (Math.log2(Math.max(0.18, Math.min(8.5, v))) - lo)) / (hi - lo);
  let g = '';
  [0.25, 0.5, 2, 4, 8].forEach((t) => (g += `<line x1="${X(t)}" x2="${X(t)}" y1="14" y2="${16 + rows.length * rowH}" stroke="var(--grid)"/><text x="${X(t)}" y="10" text-anchor="middle">×${t}</text>`));
  g += `<text x="${x0}" y="10" text-anchor="middle" style="fill:var(--ink-2)">×1</text>`;
  rows.forEach((r, i) => {
    const y = 18 + i * rowH, x = X(r.lift), up = r.lift >= 1;
    const a = Math.min(x, x0), bw = Math.max(2, Math.abs(x - x0));
    g += `<g data-tip="${esc(r.tip ?? `${r.label}：×${r.lift.toFixed(2)}${r.share != null ? `，占 ${pct(r.share)}` : ''}`)}">
      <rect x="0" y="${y - 4}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + barH - 2}" text-anchor="end">${esc(r.label)}</text>
      <rect x="${a}" y="${y}" width="${bw}" height="${barH}" rx="3" fill="${up ? 'var(--s1)' : 'var(--s2)'}"/>
      <text class="val" x="${up ? x + 6 : x0 + 6}" y="${y + barH - 2}">×${r.lift.toFixed(r.lift < 1 ? 2 : 1)}</text></g>`;
  });
  g += `<line x1="${x0}" x2="${x0}" y1="14" y2="${16 + rows.length * rowH}" stroke="var(--axis)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${width} ${20 + rows.length * rowH}" width="100%" role="img">${g}</svg>`;
}

/** 两条并排 */
function dual(rows, { width = 460, labelW = 110, aName = '日常图', bName = '私密图' } = {}) {
  const rowH = 34, w = width - labelW - 56;
  const max = Math.max(...rows.flatMap((r) => [r.a, r.b]));
  let g = '';
  rows.forEach((r, i) => {
    const y = i * rowH + 4, wa = (r.a / max) * w, wb = (r.b / max) * w;
    g += `<g data-tip="${esc(r.label)}：${aName} ${pct(r.a)} · ${bName} ${pct(r.b)}">
      <rect x="0" y="${y - 2}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + 17}" text-anchor="end">${esc(r.label)}</text>
      <rect x="${labelW}" y="${y + 2}" width="${Math.max(2, wa)}" height="10" rx="3" fill="var(--s3)"/>
      <text class="val" x="${labelW + wa + 6}" y="${y + 11}">${pct(r.a, 0)}</text>
      <rect x="${labelW}" y="${y + 15}" width="${Math.max(2, wb)}" height="10" rx="3" fill="var(--s8)"/>
      <text class="val" x="${labelW + wb + 6}" y="${y + 24}">${pct(r.b, 0)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${width} ${rows.length * rowH + 6}" width="100%" role="img">${g}</svg>`;
}

/** 点图：每行几种对照下的倍数（对数轴） */
function dotplot(rows, series, { width = 1000, labelW = 90, lo = 0.35, hi = 3 } = {}) {
  const rowH = 28, w = width - labelW - 20;
  const L = Math.log(lo), H = Math.log(hi);
  const X = (v) => labelW + (w * (Math.log(Math.max(lo, Math.min(hi, v))) - L)) / (H - L);
  let g = '';
  [0.5, 0.75, 1, 1.5, 2].forEach((t) => (g += `<line x1="${X(t)}" x2="${X(t)}" y1="16" y2="${20 + rows.length * rowH}" stroke="${t === 1 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="${t === 1 ? 1.5 : 1}"/><text x="${X(t)}" y="11" text-anchor="middle">×${t}</text>`));
  rows.forEach((r, i) => {
    const y = 30 + i * rowH;
    const vs = series.map((s) => r.vals[s.key]).filter((v) => v != null && isFinite(v));
    g += `<text class="lab" x="${labelW - 8}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text>`;
    if (vs.length) g += `<line x1="${X(Math.min(...vs))}" x2="${X(Math.max(...vs))}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="6" stroke-linecap="round"/>`;
    series.forEach((s) => {
      const v = r.vals[s.key];
      if (v == null || !isFinite(v)) return;
      g += `<circle cx="${X(v)}" cy="${y}" r="${s.big ? 7 : 5.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${r.label} · ${s.label}：×${v.toFixed(2)}`)}"/>`;
    });
  });
  return `<svg viewBox="0 0 ${width} ${36 + rows.length * rowH}" width="100%" role="img">${g}</svg>`;
}

/** 分组横条：每行几组对照的比例 */
function groupbars(rows, series, { width = 460, labelW = 150 } = {}) {
  const bh = 7, gap = 2, rowH = series.length * (bh + gap) + 12, w = width - labelW - 50;
  const max = Math.max(...rows.flatMap((r) => series.map((s) => r.vals[s.key] ?? 0)));
  let g = '';
  rows.forEach((r, i) => {
    const y0 = i * rowH + 4;
    g += `<text class="lab" x="${labelW - 8}" y="${y0 + (series.length * (bh + gap)) / 2 + 4}" text-anchor="end">${esc(r.label)}</text>`;
    series.forEach((s, k) => {
      const v = r.vals[s.key] ?? 0, bw = Math.max(1.5, (v / max) * w), y = y0 + k * (bh + gap);
      g += `<g data-tip="${esc(`${r.label} · ${s.label}：${pct(v)}`)}"><rect x="${labelW}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${s.color}"/>${k === 0 ? `<text class="val" x="${labelW + bw + 5}" y="${y + bh}">${pct(v, 1)}</text>` : ''}</g>`;
    });
  });
  return `<svg viewBox="0 0 ${width} ${rows.length * rowH + 6}" width="100%" role="img">${g}</svg>`;
}

/** 带区间的倍数条 */
function cibars(rows, { width = 460, labelW = 96, lo = 0.4, hi = 2.6 } = {}) {
  const rowH = 30, w = width - labelW - 60;
  const L = Math.log(lo), H = Math.log(hi);
  const X = (v) => labelW + (w * (Math.log(Math.max(lo, Math.min(hi, v))) - L)) / (H - L);
  let g = '';
  [0.5, 1, 2].forEach((t) => (g += `<line x1="${X(t)}" x2="${X(t)}" y1="14" y2="${18 + rows.length * rowH}" stroke="${t === 1 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="${t === 1 ? 1.5 : 1}"/><text x="${X(t)}" y="10" text-anchor="middle">×${t}</text>`));
  rows.forEach((r, i) => {
    const y = 30 + i * rowH, sig = r.lo > 1 || r.hi < 1;
    const col = !sig ? 'var(--muted)' : r.ratio > 1 ? 'var(--s1)' : 'var(--s2)';
    g += `<g data-tip="${esc(r.tip ?? `${r.label}：×${r.ratio.toFixed(2)}（区间 ${r.lo.toFixed(2)}–${r.hi.toFixed(2)}）`)}"><rect x="0" y="${y - 12}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text>
      <line x1="${X(r.lo)}" x2="${X(r.hi)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/>
      <line x1="${X(r.lo)}" x2="${X(r.lo)}" y1="${y - 5}" y2="${y + 5}" stroke="${col}" stroke-width="2"/><line x1="${X(r.hi)}" x2="${X(r.hi)}" y1="${y - 5}" y2="${y + 5}" stroke="${col}" stroke-width="2"/>
      <circle cx="${X(r.ratio)}" cy="${y}" r="6" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
      <text class="val" x="${X(r.hi) + 8}" y="${y + 4}">×${r.ratio.toFixed(2)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${width} ${36 + rows.length * rowH}" width="100%" role="img">${g}</svg>`;
}

/** 入坑时间线：入坑 → 高峰 */
function timeline(rows, { width = 1000, labelW = 110, from = '2022-01-01', to = '2026-05-01' } = {}) {
  const rowH = 22, w = width - labelW - 60, t0 = +new Date(from), t1 = +new Date(to);
  const X = (d) => labelW + ((+new Date(d) - t0) / (t1 - t0)) * w;
  let g = '';
  for (let y = 2022; y <= 2026; y++) g += `<line x1="${X(`${y}-01-01`)}" x2="${X(`${y}-01-01`)}" y1="14" y2="${18 + rows.length * rowH}" stroke="var(--grid)"/><text x="${X(`${y}-01-01`)}" y="10" text-anchor="middle">${y}</text>`;
  rows.forEach((r, i) => {
    const y = 26 + i * rowH, slow = r.toPeak >= 180;
    g += `<g data-tip="${esc(`${r.name}：${r.start} 入坑 → ${r.peak} 高峰（${r.toPeak} 天），高峰那 30 天占她全部的 ${pct(r.peakShare, 0)}，半年后仍有 ${pct(r.tail, 0)}`)}">
      <rect x="0" y="${y - 10}" width="${width}" height="${rowH}" fill="transparent"/>
      <text class="lab" x="${labelW - 8}" y="${y + 4}" text-anchor="end">${esc(r.name)}</text>
      <line x1="${X(r.start)}" x2="${X(r.peak)}" y1="${y}" y2="${y}" stroke="${slow ? 'var(--s7)' : 'var(--s3)'}" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${X(r.start)}" cy="${y}" r="3.5" fill="var(--axis)"/>
      <circle cx="${X(r.peak)}" cy="${y}" r="6" fill="${slow ? 'var(--s7)' : 'var(--s3)'}" stroke="var(--surface)" stroke-width="2"/>
      <text class="val" x="${X(r.peak) + 10}" y="${y + 4}">${r.toPeak} 天</text></g>`;
  });
  return `<svg viewBox="0 0 ${width} ${30 + rows.length * rowH}" width="100%" role="img">${g}</svg>`;
}

  ${RS.up.length ? `<div class="card"><h3>隔了很久又存一次的图，比其它图多出来的</h3>${divbars(RS.up.slice(0, 12).map((t) => ({ label: t.zh, lift: t.lift, tip: `${t.zh}：其它图 ${pct(t.base)} → 反复保存的 ${pct(t.re)}` })), { width: 1000, labelW: 160 })}</div>` : ''}
  ${bullets(sec('arcs').points)}</section>`);

// 最像你的图
if (D.mostYou.length)
  add(`<section>${H('最像你的几张图')}${intro('most')}<div class="chars">${(S.mostIds ?? D.mostYou.slice(0, 8).map((m) => m.id)).map((id) => `<div class="char"><div class="img" style="background-image:${cover(id)}"></div></div>`).join('')}</div>
  <p class="note">按每张图的标签在你这里比对照组多出多少打分，取全年龄的单人插画。图从本机 Emaki 读取。</p></section>`);

// 私密
const X = D.private;
if (X) {
  const ORI = ['独自一人', '多名女性（无互动）', '女女', '与男性'];
  const ladSegs = X.levels.map((k, i) => ({ key: k, label: k, color: ['var(--s3)', 'var(--s1)', 'var(--s7)', 'var(--s4)', 'var(--s5)', 'var(--s2)', 'var(--s8)'][i] }));
  add(`<section id="private">${H('私密：画面关系、尺度、部位')}${intro('private')}
  <div class="grid g2">
    <div class="card"><h3>画面里的关系：全部 vs 较敏感 / 限制级</h3>${dual(ORI.map((k) => ({ label: k, a: X.orientation.all[k] ?? 0, b: X.orientation.nsfw[k] ?? 0 })), { aName: '全部', bName: '较敏感/限制级', labelW: 130 })}</div>
    <div class="card"><h3>尺度阶梯（每张图按最高一级算）</h3>${hbars(X.ladder.map((l, i) => ({ label: l.name, value: l.share, color: ladSegs[i].color })), { labelW: 100 })}</div>
    <div class="card"><h3>画面在强调哪里：日常图 vs 私密图</h3>${dual(X.parts.map((p) => ({ label: p.name, a: p.sfw, b: p.nsfw })))}</div>
    <div class="card"><h3>服装（和 Danbooru 全站比）</h3>${divbars(X.wear.slice(0, 18).map((t) => ({ label: t.zh.replace(/（.*）/, ''), lift: t.lift, share: t.share })), { labelW: 120 })}</div>
  </div>
  <div class="card"><h3>姿势</h3>${divbars(X.poses.map((t) => ({ label: t.zh.replace(/（.*）/, ''), lift: t.lift, share: t.share })), { width: 1000, labelW: 120 })}</div>
  <div class="card"><h3>尺度阶梯在各时期的构成</h3><div class="legend">${ladSegs.map((s) => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>${stack100(P, X.ladderPer, ladSegs)}</div>
  ${bullets(sec('private').points)}${note('private')}</section>`);
}

if (S.summary?.length) add(`<section>${H('画像总结')}${S.summary.map((x) => `<div class="card">${x}</div>`).join('')}</section>`);
add(`<footer class="meta" style="margin-top:48px">${S.footer ?? `生成于 ${D.generatedAt.slice(0, 10)}，数据来自本机 Emaki 图库的只读快照。这个页面只在本机打开。`}</footer>`);

</script>
</body>
</html>
